<title>Validéo a déménagé</title>
<meta http-equiv="refresh" content="0; url=https://valideo.netlify.app/">
<script>
  // Ancienne adresse GitHub Pages : on renvoie vers la même page sur Netlify, en gardant le lien complet
  (function () {
    var p = location.pathname.replace(/^\/valideo(?=\/|$)/i, '') || '/';
    if (p === '/beta.html') p = '/app.html';
    location.replace('https://valideo.netlify.app' + p + location.search + location.hash);
  })();
</script>
